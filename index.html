<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="mobile-web-app-capable"
            content="no"
        />
        <meta
            name="description"
            content="Succubus Club is a platform for playing realtime V:TES (Vampire: The Eternal Struggle) card game in a web browser, built with modern web technologies"
        />
        <link
            rel="icon"
            type="image/png"
            href="/favicon.png"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Succubus Club</title>

        <!-- Preload welcome sign for main menu -->
        <link
            rel="preload"
            href="/assets/welcomeSign.png"
            as="image"
        />

        <!-- Prefetch tabletop background for loading display -->
        <link
            rel="prefetch"
            href="/assets/tabletopBackground.jpg"
            as="image"
        />
    </head>

    <body>
        <div id="mountMe"></div>
        <script
            type="module"
            src="src/client/main.ts"
        ></script>
    </body>
</html>
