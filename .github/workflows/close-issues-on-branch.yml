name: Close Issues on Dev Push

on:
    push:
        branches:
            - dev # 👈 This ensures it ONLY triggers when you push to the dev branch

jobs:
    close-issue:
        runs-on: ubuntu-latest
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Parse Commit and Close Issue
                uses: actions/github-script@v7
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        const commits = context.payload.commits;
                        if (!commits) return;

                        const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;

                        for (const commit of commits) {
                          let match;
                          while ((match = regex.exec(commit.message)) !== null) {
                            const issueNumber = parseInt(match[1], 10);

                            console.log(`Closing issue #${issueNumber} from commit: "${commit.message}"`);

                            try {
                              await github.rest.issues.update({
                                owner: context.repo.owner,
                                repo: context.repo.repo,
                                issue_number: issueNumber,
                                state: 'closed'
                              });
                            } catch (error) {
                              console.error(`Failed to close issue #${issueNumber}:`, error.message);
                            }
                          }
                        }
